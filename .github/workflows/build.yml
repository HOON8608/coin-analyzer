
name: Build Coin Analyzer for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CoinAnalyzer main.py

      - name: Check files
        shell: pwsh
        run: |
          Write-Host "Checking installer files"
          Get-Location
          Get-ChildItem
          if (!(Test-Path "CoinAnalyzer.iss")) {
            throw "CoinAnalyzer.iss is missing"
          }
          if (!(Test-Path "dist\CoinAnalyzer.exe")) {
            throw "CoinAnalyzer.exe is missing"
          }
          New-Item -ItemType Directory -Force -Path "Output"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $script = Join-Path $env:GITHUB_WORKSPACE "CoinAnalyzer.iss"

          if (!(Test-Path $compiler)) {
            throw "ISCC.exe not found"
          }

          if (!(Test-Path $script)) {
            throw "CoinAnalyzer.iss not found"
          }

          & $compiler $script
          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CoinAnalyzer-Windows-Installer
          path: Output/CoinAnalyzer_Setup.exe
          if-no-files-found: error
          retention-days: 30
